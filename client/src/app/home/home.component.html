<div class="flex flex-col items-center justify-center w-screen h-fit">
	<h1 class="mb-8 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500 text-7xl font-mono font-extrabold">AUTH</h1>
	@if (!loginFlowStarted()) {
		<p-button
			class="rounded-full shadow-lg justify-center items-center text-2xl"
			(onClick)="startLogin()"
		>
			<h2 class="tracking-wide text-4xl">Log In</h2>
		</p-button>
	}
	<router-outlet></router-outlet>
</div>
